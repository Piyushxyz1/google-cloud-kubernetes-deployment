apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: nexora-backend-secrets-provider
  namespace: nexora-dev
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/nexora-dev-512809/secrets/mongo_db/versions/latest"
        path: "mongo_db"
      - resourceName: "projects/nexora-dev-512809/secrets/JWT_SECRET/versions/latest"
        path: "JWT_SECRET"
      - resourceName: "projects/nexora-dev-512809/secrets/RAZORPAY_KEY_ID/versions/latest"
        path: "RAZORPAY_KEY_ID"
      - resourceName: "projects/nexora-dev-512809/secrets/RAZORPAY_KEY_SECRET/versions/latest"
        path: "RAZORPAY_KEY_SECRET"
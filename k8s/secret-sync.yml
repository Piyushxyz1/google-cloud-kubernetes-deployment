apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: nexora-backend-secrets
  namespace: nexora-dev
spec:
  serviceAccountName: nexora-backend
  secretProviderClassName: nexora-backend-secrets-provider
  secretObject:
    type: Opaque
    data:
      - sourcePath: mongo_db
        targetKey: mongo_db
      - sourcePath: JWT_SECRET
        targetKey: JWT_SECRET
      - sourcePath: RAZORPAY_KEY_ID
        targetKey: RAZORPAY_KEY_ID
      - sourcePath: RAZORPAY_KEY_SECRET
        targetKey: RAZORPAY_KEY_SECRET
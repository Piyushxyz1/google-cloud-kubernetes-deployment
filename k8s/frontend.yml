
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-frontend
  namespace: nexora-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexora-frontend
  template:
    metadata:
      labels:
        app: nexora-frontend
    spec:
      containers:
        - name: nexora-frontend
          image: asia-south1-docker.pkg.dev/nexora-dev-512809/nexora-dev-images/nexora-frontend:8faaa6d8b8f0321696280db28ff2fe6f8baf990f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-frontend
  namespace: nexora-dev
spec:
  type: ClusterIP
  selector:
    app: nexora-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

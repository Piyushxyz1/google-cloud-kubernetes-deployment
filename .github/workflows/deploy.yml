
name: Build and Deploy Nexora Backend to GKE

on:
  push:
    branches:
      - dev
    paths:
      - "server/**"
      - "k8s/backend.yaml"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: nexora-dev-512809
  REGION: asia-south1
  REPOSITORY: nexora-dev-images
  NAMESPACE: nexora-dev
  BACKEND_IMAGE: nexora-backend

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Authenticate using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: nexora-dev-512809
          workload_identity_provider: projects/148158973648/locations/global/workloadIdentityPools/github-dev-pool/providers/github-dev-provider
          service_account: github-actions-dev@nexora-dev-512809.iam.gserviceaccount.com

      # 3. Install Google Cloud CLI
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # 4. Authenticate Docker to Artifact Registry
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            asia-south1-docker.pkg.dev --quiet

      # 5. Build and push backend image
      - name: Build and push backend image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="asia-south1-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${BACKEND_IMAGE}:${GITHUB_SHA}"

          docker build \
            -t "$IMAGE" \
            ./server

          docker push "$IMAGE"

          echo "BACKEND_IMAGE_URI=$IMAGE" >> "$GITHUB_ENV"

      # 6. Connect to Terraform-created GKE cluster
      - name: Connect to GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: nexora-dev-512809

      # 7. Create namespace
      - name: Ensure namespace exists
        shell: bash
        run: |
          set -euo pipefail

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 8. Ensure backend Kubernetes ServiceAccount exists
      - name: Ensure backend ServiceAccount exists
        shell: bash
        run: |
          set -euo pipefail

          kubectl create serviceaccount nexora-backend \
            --namespace="$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 9. Create or update backend runtime secrets
      - name: Create or update backend secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_DB: ${{ secrets.mongo_db }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$JWT_SECRET" || -z "$MONGO_DB" ]]; then
            echo "Required backend secrets are missing."
            exit 1
          fi

          kubectl create secret generic nexora-backend-secrets \
            --namespace="$NAMESPACE" \
            --from-literal="JWT_SECRET=$JWT_SECRET" \
            --from-literal="mongo_db=$MONGO_DB" \
            --from-literal="RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" \
            --from-literal="RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 10. Apply backend Deployment and Service
      - name: Apply backend Kubernetes manifests
        run: |
          kubectl apply -f k8s/backend.yaml

      # 11. Update Deployment to the image built in this run
      - name: Update backend image
        run: |
          kubectl set image deployment/nexora-backend \
            nexora-backend="$BACKEND_IMAGE_URI" \
            --namespace="$NAMESPACE"

      # 12. Verify deployment
      - name: Verify backend rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/nexora-backend \
            --namespace="$NAMESPACE" \
            --timeout=300s

          kubectl get pods,services \
            --namespace="$NAMESPACE"

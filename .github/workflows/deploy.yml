name: Build and Push Nexora Images

on:
  push:
    branches:
      - dev
    paths:
      - "client/**"
      - "server/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: nexora-dev-512809
  REGION: asia-south1
  REPOSITORY: nexora-dev-images

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: nexora-dev-512809
          workload_identity_provider: projects/148158973648/locations/global/workloadIdentityPools/github-dev-pool/providers/github-dev-provider
          service_account: github-actions-dev@nexora-dev-512809.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push backend
        run: |
          docker build \
            -t asia-south1-docker.pkg.dev/nexora-dev-512809/nexora-dev-images/nexora-backend:${GITHUB_SHA} \
            ./server

          docker push \
            asia-south1-docker.pkg.dev/nexora-dev-512809/nexora-dev-images/nexora-backend:${GITHUB_SHA}

      - name: Build and push frontend
        run: |
          docker build \
            --build-arg VITE_API_URL="" \
            -t asia-south1-docker.pkg.dev/nexora-dev-512809/nexora-dev-images/nexora-frontend:${GITHUB_SHA} \
            ./client

          docker push \
            asia-south1-docker.pkg.dev/nexora-dev-512809/nexora-dev-images/nexora-frontend:${GITHUB_SHA}


apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-backend
  namespace: nexora-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexora-backend
  template:
    metadata:
      labels:
        app: nexora-backend
    spec:
      serviceAccountName: nexora-backend
      containers:
        - name: nexora-backend
          image: asia-south1-docker.pkg.dev/nexora-dev-512809/nexora-dev-images/nexora-backend:8faaa6d8b8f0321696280db28ff2fe6f8baf990f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: nexora-backend-secrets
          env:
            - name: PORT
              value: "8000"
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-backend
  namespace: nexora-dev
spec:
  type: ClusterIP
  selector:
    app: nexora-backend
  ports:
    - port: 8000
      targetPort: 8000

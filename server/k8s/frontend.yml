
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-frontend
  namespace: nexora-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexora-frontend
  template:
    metadata:
      labels:
        app: nexora-frontend
    spec:
      containers:
        - name: nexora-frontend
          image: asia-south1-docker.pkg.dev/nexora-dev-512809/nexora-dev-images/nexora-frontend:8faaa6d8b8f0321696280db28ff2fe6f8baf990f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-frontend
  namespace: nexora-dev
spec:
  type: ClusterIP
  selector:
    app: nexora-frontend
  ports:
    - port: 80
      targetPort: 80

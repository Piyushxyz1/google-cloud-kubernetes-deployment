
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexora-frontend
  template:
    metadata:
      labels:
        app: nexora-frontend
    spec:
      containers:
        - name: nexora-frontend
          image: asia-south1-docker.pkg.dev/project-b5c30372-900e-4517-a50/nexora-images/nexora-frontend:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-frontend
spec:
  type: ClusterIP
  selector:
    app: nexora-frontend
  ports:
    - port: 80
      targetPort: 80
